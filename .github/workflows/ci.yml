name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test (race, shuffled)
        env:
          CGO_ENABLED: "1"
        run: go test -race -shuffle=on ./...

  corpus:
    name: corpus conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawn-analysis
        uses: actions/checkout@v7
        with:
          path: pawn-analysis

      - name: Check out pawn-corpus
        uses: actions/checkout@v7
        with:
          repository: pawnkit/pawn-corpus
          ref: 43cee425a3a528d1b71d4e2a24eb250b7df62d59
          path: pawn-corpus

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run corpus-backed tests
        working-directory: pawn-analysis
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: go test -count=1 ./...

      - name: Validate corpus metadata
        working-directory: pawn-corpus
        run: go run ./tools/validate ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  fuzz:
    name: fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Fuzz preprocessor
        run: go test ./preprocess -run=^$ -fuzz=FuzzRun -fuzztime=30s

      - name: Fuzz symbol builder
        run: go test ./symbol -run=^$ -fuzz=FuzzBuild -fuzztime=30s

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run benchmarks
        run: go test ./... -run=^$ -bench=. -benchmem

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pawnkit/pawn-actions/support-check@v1.8.72
        with:
          repository: pawnkit/pawn-analysis
          targets: linux-amd64
